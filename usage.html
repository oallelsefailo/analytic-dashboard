<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0e14; --surface: #131720; --surface2: #1a2030; --surface3: #1f2840;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #e8edf5; --text2: #8b9ab5; --text3: #5a6a85;
    --accent: #3d7fff; --accent2: #5b9aff; --green: #22c77d; --red: #ff4f6a;
    --amber: #f59e0b; --purple: #9b72ff; --teal: #0fd4b8;
    --font: 'DM Sans', system-ui, sans-serif; --mono: 'DM Mono', monospace;
    --radius: 10px; --radius-lg: 14px;
  }
  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

  .container { max-width: 900px; margin: 0 auto; padding: 40px 28px; }
  .header { margin-bottom: 32px; }
  .header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .header p { font-size: 13px; color: var(--text3); margin-top: 4px; }

  .controls { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .ctrl-btn {
    padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text2); font-size: 13px;
    font-family: var(--font); cursor: pointer; transition: all 0.15s;
  }
  .ctrl-btn:hover { border-color: var(--border2); color: var(--text); }
  .ctrl-btn.active { background: rgba(61,127,255,0.12); color: var(--accent2); border-color: rgba(61,127,255,0.25); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 20px;
  }
  .card h2 { font-size: 14px; font-weight: 500; color: var(--text2); margin-bottom: 16px; letter-spacing: 0.3px; text-transform: uppercase; font-size: 11px; }

  .stat-row { display: flex; gap: 16px; margin-bottom: 24px; }
  .stat-box {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 18px 20px; text-align: center;
  }
  .stat-val { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
  .stat-label { font-size: 12px; color: var(--text3); margin-top: 2px; }

  .chart-wrap { height: 220px; position: relative; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: var(--mono); font-size: 13px; }
  .visits-bar { display: flex; align-items: center; gap: 10px; }
  .bar-fill { height: 6px; border-radius: 3px; background: var(--accent); min-width: 4px; }
  .empty { text-align: center; padding: 40px; color: var(--text3); font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Dashboard Usage</h1>
    <p>Page views by authenticated Cloudflare Access users</p>
  </div>

  <div class="controls">
    <button class="ctrl-btn active" data-days="7">7 days</button>
    <button class="ctrl-btn" data-days="30">30 days</button>
    <button class="ctrl-btn" data-days="90">90 days</button>
    <span style="width:1px;background:var(--border);margin:0 4px"></span>
    <button class="ctrl-btn active" data-group="day">Daily</button>
    <button class="ctrl-btn" data-group="week">Weekly</button>
    <button class="ctrl-btn" data-group="month">Monthly</button>
  </div>

  <div class="stat-row">
    <div class="stat-box">
      <div class="stat-val" id="totalViews">—</div>
      <div class="stat-label">Total Views</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="uniqueUsers">—</div>
      <div class="stat-label">Unique Users</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="avgDaily">—</div>
      <div class="stat-label">Avg / Day</div>
    </div>
  </div>

  <div class="card">
    <h2>Views Over Time</h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="card">
    <h2>Users</h2>
    <div id="userTable"></div>
  </div>
</div>

<script>
let currentDays = 7, currentGroup = 'day', chart = null;

document.querySelectorAll('.ctrl-btn[data-days]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.ctrl-btn[data-days]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentDays = +b.dataset.days;
    load();
  });
});
document.querySelectorAll('.ctrl-btn[data-group]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.ctrl-btn[data-group]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentGroup = b.dataset.group;
    load();
  });
});

async function load() {
  try {
    const r = await fetch(`/api/usage-stats?days=${currentDays}&group=${currentGroup}`);
    const d = await r.json();
    render(d);
  } catch (e) {
    console.error(e);
  }
}

function render(d) {
  document.getElementById('totalViews').textContent = d.total_views.toLocaleString();
  document.getElementById('uniqueUsers').textContent = d.by_user.length;
  document.getElementById('avgDaily').textContent = currentDays > 0
    ? (d.total_views / currentDays).toFixed(1) : '—';

  // Chart
  const labels = d.by_period.map(p => p.period);
  const values = d.by_period.map(p => p.visits);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: 'rgba(61,127,255,0.5)',
        borderColor: 'rgba(61,127,255,0.8)',
        borderWidth: 1,
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#5a6a85', font: { size: 11 } } },
        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#5a6a85', font: { size: 11 }, stepSize: 1 } }
      }
    }
  });

  // User table
  const el = document.getElementById('userTable');
  if (!d.by_user.length) {
    el.innerHTML = '<div class="empty">No visits recorded yet</div>';
    return;
  }
  const maxVisits = d.by_user[0].visits;
  el.innerHTML = `<table>
    <thead><tr><th>User</th><th>Visits</th><th style="width:40%"></th></tr></thead>
    <tbody>${d.by_user.map(u => `<tr>
      <td class="mono">${u.email}</td>
      <td>${u.visits}</td>
      <td><div class="visits-bar"><div class="bar-fill" style="width:${Math.max(4, (u.visits/maxVisits)*100)}%"></div></div></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

load();
</script>
</body>
</html>
